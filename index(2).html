<html lang="es">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #0e0e10; color: #efeff1; height: 100vh; overflow: hidden; }
    .layout { display: grid; grid-template-columns: 1fr 390px; height: 100vh; width: 100vw; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 340px; } }
    .stage { position: relative; background: #141417; overflow: hidden; }
    .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,14,0.88) 0%, rgba(10,10,14,0.18) 55%, rgba(10,10,14,0.42) 100%); pointer-events: none; }
    .top-bar { position: absolute; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
    .live-pill { background: #eb0400; color: #fff; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 4px; letter-spacing: 0.04em; }
    .viewers { background: rgba(14,14,16,0.75); color: #efeff1; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .poll-box { position: absolute; top: 58px; right: 20px; width: 310px; background: rgba(24,24,27,0.94); border: 1px solid rgba(255,255,255,0.16); border-radius: 8px; padding: 12px 14px; display: none; backdrop-filter: blur(8px); }
    .poll-box.visible { display: block; }
    .poll-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
    .bar-bg { height: 8px; background: #2d2d35; border-radius: 4px; overflow: hidden; margin-top: 5px; display: flex; }
    .bar-tacos { background: #f97316; height: 100%; transition: width 0.35s ease; }
    .bar-arepas { background: #eab308; height: 100%; transition: width 0.35s ease; }
    .bottom-area { position: absolute; bottom: 20px; left: 22px; right: 22px; display: flex; flex-direction: column; gap: 12px; }
    .question-banner { background: rgba(18,18,22,0.93); border: 2px solid #f97316; border-radius: 10px; padding: 14px 18px; display: none; backdrop-filter: blur(8px); }
    .question-banner.visible { display: block; }
    .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
    .q-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; color: #0e0e10; }
    .q-title { font-family: 'Outfit', sans-serif; font-size: clamp(18px, 2vw, 25px); font-weight: 700; color: #fff; line-height: 1.3; }
    .scene-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .scene-name { font-family: 'Outfit', sans-serif; font-size: clamp(18px, 2vw, 24px); font-weight: 700; color: #fff; }
    .scene-sub { font-size: 13px; color: #d4d4d8; margin-top: 2px; }
    .discreet-nav { display: flex; align-items: center; gap: 6px; opacity: 0.35; transition: opacity 0.2s; }
    .stage:hover .discreet-nav, .discreet-nav:focus-within { opacity: 0.95; }
    .nav-btn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.16); background: rgba(14,14,16,0.75); color: #efeff1; font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .nav-btn:hover:not(:disabled) { background: rgba(145,71,255,0.85); border-color: #9147ff; }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }
    .chat-col { background: #18181b; border-left: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; min-height: 0; }
    .chat-head { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; color: #e4e4e7; text-transform: uppercase; }
    .chat-pin { background: #202026; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; display: none; }
    .chat-pin.visible { display: block; }
    .chat-list { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
    .msg { font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg-q { border-radius: 8px; padding: 10px 12px; font-size: 16px; line-height: 1.4; background: rgba(255,255,255,0.05); border: 1px solid #f97316; }
    .badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px; margin-right: 5px; vertical-align: middle; background: #32323a; color: #fff; }
    .chat-form { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 8px; }
    .chat-form input { flex: 1; background: #0e0e10; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13px; }
    .chat-form button { background: #9147ff; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
  </style>

    const btnNext = document.getElementById('btn-next');

    function updatePollUI() {
      const total = tacosVotes + arepasVotes;
      const tPct = total === 0 ? 0 : Math.round((tacosVotes / total) * 100);
      const aPct = total === 0 ? 0 : 100 - tPct;
      document.getElementById('poll-total').textContent = total + ' votos';
      document.getElementById('lbl-tacos').textContent = 'Tacos · ' + tPct + '%';
      document.getElementById('lbl-arepas').textContent = aPct + '% · Arepas';
      document.getElementById('bar-tacos').style.width = tPct + '%';
      document.getElementById('bar-arepas').style.width = aPct + '%';
    }

    function renderCue(triggerChat) {
      const cue = DATA.cues[step];
      const scene = DATA.scenes[cue.scene];
      if (scene.imageUrl) { elImg.src = scene.imageUrl; elImg.style.display = 'block'; } else { elImg.style.display = 'none'; }
      elTitle.textContent = scene.title;
      elSub.textContent = scene.subtitle;
      btnPrev.disabled = step === 0;
      btnNext.disabled = step >= DATA.cues.length - 1;

      if (cue.triggerPoll && !pollActive) {
        pollActive = true;
        tacosVotes = 0;
        arepasVotes = 0;
        updatePollUI();
      } else if (!cue.triggerPoll && step < 5) {
        pollActive = false;
      }
      elPollBox.classList.toggle('visible', pollActive);

      if (cue.chatTrigger) {
        const col = cue.speakerColor;
        elBanner.className = 'question-banner visible';
        elBanner.style.borderColor = col;
        const tag = cue.chatTrigger.amountText ? cue.chatTrigger.badgeText + ' · ' + cue.chatTrigger.amountText : cue.chatTrigger.badgeText;
        elQTag.textContent = tag;
        elQTag.style.background = col;
        elQUser.textContent = '@' + cue.chatTrigger.username;
        elQText.textContent = '«' + cue.chatTrigger.question + '»';

        elChatPin.className = 'chat-pin visible';
        elChatPin.style.borderBottomColor = col;
        elChatPin.innerHTML = '<div style="font-size:11px;font-weight:700;color:' + col + ';">' + tag + ' · @' + cue.chatTrigger.username + '</div><div style="font-size:14px;font-weight:700;color:#fff;margin-top:2px;">' + cue.chatTrigger.question + '</div>';

        if (triggerChat) {
          const box = document.createElement('div');
          box.className = 'msg-q';
          box.style.borderColor = col;
          box.style.background = col + '22';
          box.innerHTML = '<div style="font-size:11px;font-weight:800;color:' + col + ';margin-bottom:3px;">' + tag + ' · @' + cue.chatTrigger.username + '</div><div style="font-weight:700;color:#fff;">' + cue.chatTrigger.question + '</div>';
          elChatList.appendChild(box);
          elChatList.scrollTop = elChatList.scrollHeight;
        }
      } else {
        elBanner.className = 'question-banner';
        elChatPin.className = 'chat-pin';
      }
    }

    function pushAmbient() {
      const m = DATA.ambient[ambientIdx % DATA.ambient.length];
      ambientIdx++;
      if (pollActive) {
        if (m.voteTeam === 'tacos') tacosVotes += 3;
        else if (m.voteTeam === 'arepas') arepasVotes += 3;
        else if (ambientIdx % 2 === 0) tacosVotes += 1;
        else arepasVotes += 1;
        updatePollUI();
      }
      const div = document.createElement('div');
      div.className = 'msg';
      if (m.isFollowEvent) {
        div.style.cssText = 'background:rgba(145,71,255,0.14);border-radius:6px;padding:6px 8px;color:#d8b4fe;font-weight:600;';
        div.textContent = m.text;
      } else {
        const badge = m.badge ? '<span class="badge">' + m.badge + '</span>' : '';
        div.innerHTML = badge + '<strong style="color:' + m.color + ';">' + m.username + '</strong>: ' + m.text;
      }
      elChatList.appendChild(div);
      while (elChatList.children.length > 75) elChatList.removeChild(elChatList.firstChild);
      elChatList.scrollTop = elChatList.scrollHeight;
    }

    btnNext.onclick = () => { if (step < DATA.cues.length - 1) { step++; renderCue(true); } };
    btnPrev.onclick = () => { if (step > 0) { step--; renderCue(false); } };
    document.getElementById('chat-form').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const val = input.value.trim();
      if (!val) return;
      if (pollActive) {
        if (val.toLowerCase().includes('taco')) tacosVotes += 2;
        if (val.toLowerCase().includes('arepa')) arepasVotes += 2;
        updatePollUI();
      }
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = '<span class="badge">CLASE</span><strong style="color:#a855f7;">Clase</strong>: ' + val.replace(/</g,'&lt;');
      elChatList.appendChild(div);
      elChatList.scrollTop = elChatList.scrollHeight;
      input.value = '';
    };
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); if (step < DATA.cues.length - 1) { step++; renderCue(true); } }
      if (e.code === 'ArrowLeft') { e.preventDefault(); if (step > 0) { step--; renderCue(false); } }
    });

    for (let i = 0; i < 6; i++) pushAmbient();
    renderCue(false);
    setInterval(pushAmbient, 1750);
    setInterval(() => {
      if (pollActive) {
        if (seconds % 2 === 0) tacosVotes += 2;
        else arepasVotes += 2;
        updatePollUI();
      }
      seconds++;
      const v = 1418 + (seconds % 29);
      document.getElementById('viewer-count').textContent = v + ' espectadores';
    }, 900);
  </script>
</body>
</html>
